name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION
categories:
  - title: Features
    labels:
      - feature
      - enhancement
  - title: Bug Fixes
    labels:
      - fix
      - bugfix
      - bug
  - title: Maintenance
    labels:
      - chore
      - maintenance
      - dependencies
  - title: Documentation
    labels:
      - documentation
      - docs
  - title: Breaking Changes
    labels:
      - breaking
change-template: "- $TITLE (#$NUMBER)"
change-title-escapes: \<*_&
version-resolver:
  major:
    labels:
      - breaking
  minor:
    labels:
      - feature
      - enhancement
  default: patch
template: |
  ## What's Changed

  $CHANGES
