name: Label Issues

on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.issue.title;
            const labels = [];
            if (title.includes("bug") || title.includes("fix")) labels.push("bug");
            if (title.includes("feature") || title.includes("feat")) labels.push("enhancement");
            if (title.includes("docs") || title.includes("documentation")) labels.push("documentation");
            if (labels.length) github.rest.issues.addLabels({
              issue_number: context.payload.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels,
            });
